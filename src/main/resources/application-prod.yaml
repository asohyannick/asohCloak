spring:
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false

logging:
  level:
    root: WARN
    com.asohcloak: INFO
    org.springframework.security: WARN

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

app:
  seeding:
    enabled: ${APP_SEEDING_ENABLED:false}

management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      otlp:
        enabled: false
    sampling:
      probability: 0.1

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
