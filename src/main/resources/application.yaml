spring:
  config:
    import: "optional:file:.env[.properties]"
  cache:
    cache-names:
      - rate-limit-buckets
    caffeine:
      spec: maximumSize=100000,expireAfterAccess=3600s

  application:
    name: ${APP_NAME}

  datasource:
    url: jdbc:postgresql://${DATABASE_POSTGRESQL_HOST}:${DATABASE_POSTGRESQL_PORT}/${DATABASE_POSTGRESQL_NAME}
    username: ${DATABASE_POSTGRESQL_USER}
    password: ${DATABASE_POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
    url: jdbc:postgresql://${DATABASE_POSTGRESQL_HOST}:${DATABASE_POSTGRESQL_PORT}/${DATABASE_POSTGRESQL_NAME}
    user: ${DATABASE_POSTGRESQL_USER}
    password: ${DATABASE_POSTGRESQL_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

server:
  port: ${APP_PORT}
  servlet:
    context-path: /api/${API_VERSION}

keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL}
    realm: ${KEYCLOAK_REALM}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

resend:
  api-key: ${RESEND_API_KEY}
  sender:
    email: ${RESEND_SENDER_EMAIL}
    name: ${RESEND_SENDER_NAME}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: ${ALLOWED_METHODS}

  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
      enabled: true
    show-actuator: true

minio:
  endpoint: ${MINIO_ENDPOINT}
  port: ${MINIO_PORT}
  console-port: ${MINIO_CONSOLE_PORT}
  username: ${MINIO_USERNAME}
  password: ${MINIO_PASSWORD}
  bucket-name: ${MINIO_BUCKET_NAME}
  use-ssl: ${MINIO_USE_SSL}
  region: ${MINIO_REGION}

bucket4j:
  enabled: true
  cache-to-use: jcache
  filters:
    - id: global-rate-limit
      cache-name: rate-limit-buckets
      filter-method: servlet
      filter-order: 10
      url: /.*
      http-status-code: TOO_MANY_REQUESTS
      http-content-type: application/json
      http-response-body: '{"status":429,"message":"Too many requests. Please try again later."}'
      hide-http-response-headers: false
      metrics:
        enabled: true
        types: CONSUMED_COUNTER,REJECTED_COUNTER
        tags:
          - key: IP
            expression: "@rateLimitKeyResolver.getClientIp(#root)"
            types: REJECTED_COUNTER
          - key: URL
            expression: getRequestURI()
      rate-limits:
        - cache-key: "@rateLimitKeyResolver.resolveKey(#root)"
          bandwidths:
            - capacity: 500
              time: 1
              unit: minutes

app:
  cache:
    ttl-minutes: 5

