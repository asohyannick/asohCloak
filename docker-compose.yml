
services:
  # ---------------------------------------------------------------------------
  # Spring Boot Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asohcloak-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-asohcloak}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-asohcloak}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-asohcloak}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_USERNAME: ${MINIO_USERNAME}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_REGION: ${MINIO_REGION}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - asohcloak-net

  # ---------------------------------------------------------------------------
  # PostgreSQL — application database (users, stored_files, etc.)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: asohcloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asohcloak}
      POSTGRES_USER: ${POSTGRES_USER:-asohcloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asohcloak}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asohcloak}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asohcloak-net

  # ---------------------------------------------------------------------------
  # Redis — caching / session store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: asohcloak-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asohcloak-net

  # ---------------------------------------------------------------------------
  # MinIO — object storage (stored files, uploads)
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: asohcloak-minio
    restart: unless-stopped
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}" --address ":${MINIO_PORT:-9000}"
    environment:
      MINIO_ROOT_USER: ${MINIO_USERNAME}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      MINIO_REGION: ${MINIO_REGION}
    ports:
      - "${MINIO_PORT:-9000}:${MINIO_PORT:-9000}"
      - "${MINIO_CONSOLE_PORT:-9001}:${MINIO_CONSOLE_PORT:-9001}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${MINIO_PORT:-9000}/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asohcloak-net

  # Creates the app bucket automatically on startup
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: asohcloak-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:${MINIO_PORT:-9000} ${MINIO_USERNAME} ${MINIO_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET_NAME} &&
      exit 0
      "
    networks:
      - asohcloak-net

  # ---------------------------------------------------------------------------
  # Keycloak — identity & access management
  # ---------------------------------------------------------------------------
  keycloak-db:
    image: postgres:16-alpine
    container_name: asohcloak-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asohcloak-net

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: asohcloak-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-keycloak}
      KEYCLOAK_ADMIN: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_FEATURES: token-exchange:v1,admin-fine-grained-authz:v1
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./src/main/resources/keycloak/import:/opt/keycloak/data/import
    networks:
      - asohcloak-net

networks:
  asohcloak-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  keycloak-db-data: